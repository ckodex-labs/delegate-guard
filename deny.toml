# cargo-deny policy (cargo-deny 0.19). Run: cargo deny check
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Every dependency's license expression must be satisfiable from this list.
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are unpublished (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
